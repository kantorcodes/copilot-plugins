name: Repair HOL Guard marketplace PR branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-copilot-pr.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Rebuild contribution on current upstream main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kantorcodes"
          git config user.email "6068672+kantorcodes@users.noreply.github.com"
          git remote add upstream https://github.com/github/copilot-plugins.git || true
          git fetch upstream main
          git fetch origin add-hol-guard-plugin

          git show origin/add-hol-guard-plugin:.github/plugin/marketplace.json > /tmp/old-marketplace.json
          git show origin/add-hol-guard-plugin:README.md > /tmp/old-readme.md

          python - <<'PY'
          import json
          from pathlib import Path
          old = json.loads(Path('/tmp/old-marketplace.json').read_text())
          matches = [p for p in old['plugins'] if p.get('name') == 'hol-guard']
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one HOL Guard plugin entry, found {len(matches)}')
          Path('/tmp/hol-plugin.json').write_text(json.dumps(matches[0], indent=2) + '\n')
          lines = [line for line in Path('/tmp/old-readme.md').read_text().splitlines() if line.startswith('- **[HOL Guard]')]
          if len(lines) != 1:
              raise SystemExit(f'expected exactly one HOL Guard README line, found {len(lines)}')
          Path('/tmp/hol-readme-line.txt').write_text(lines[0] + '\n')
          PY

          git checkout -B add-hol-guard-plugin upstream/main

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.github/plugin/marketplace.json')
          data = json.loads(p.read_text())
          if any(x.get('name') == 'hol-guard' for x in data['plugins']):
              raise SystemExit('upstream already contains hol-guard; refusing duplicate')
          hol = json.loads(Path('/tmp/hol-plugin.json').read_text())
          data['plugins'].append(hol)
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          readme = Path('README.md')
          text = readme.read_text()
          line = Path('/tmp/hol-readme-line.txt').read_text().strip()
          if 'HOL Guard' in text:
              raise SystemExit('upstream README already contains HOL Guard; refusing duplicate')
          marker = '## 🤝 Contributing'
          if marker not in text:
              raise SystemExit('README contributing marker not found')
          text = text.replace(marker, line + '\n\n' + marker, 1)
          readme.write_text(text)
          PY

          python -m json.tool .github/plugin/marketplace.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.github/plugin/marketplace.json').read_text())
          assert sum(p.get('name') == 'hol-guard' for p in data['plugins']) == 1
          assert Path('README.md').read_text().count('HOL Guard') == 1
          PY
          git diff --check
          git add .github/plugin/marketplace.json README.md
          git commit -m "chore: refresh HOL Guard plugin on latest main"
          git push --force-with-lease origin add-hol-guard-plugin

          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/repair-copilot-pr.yml
          git commit -m "chore: remove one-shot PR repair workflow"
          git push origin main
